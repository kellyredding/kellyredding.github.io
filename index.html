<style>
  /* Self-hosted so the page has no third-party requests at all. Subset to
     printable ASCII: 6.9 KB rather than 77 KB of full face. Only the roman is
     served — nothing on the page is italic. */
  @font-face{
    font-family:'Roboto Mono';
    src:url('fonts/RobotoMono-Regular.woff2') format('woff2');
    font-weight:400;font-style:normal;font-display:swap;
  }

  :root{
    --ink:#0B0C0E;
    --charcoal:#16181C;
    --line:#2E3440;
    --slate:#99A1AD;
    --offwhite:#F4F3F0;
    --amber:#FFA62B;
    --mono:'Roboto Mono',ui-monospace,'SF Mono',Menlo,monospace;
  }
  *{box-sizing:border-box}
  html{height:100%}
  body{
    margin:0;
    min-height:100%;
    background:#000;
    color:var(--offwhite);
    font-family:var(--mono);
    font-size:16px;
    -webkit-font-smoothing:antialiased;
    /* upper part of the page, not dead centre */
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:clamp(40px,10vh,120px) 20px 64px;
  }

  main{display:flex;flex-direction:column;align-items:center;max-width:100%}

  .avatar{
    width:clamp(104px,18vw,150px);
    height:clamp(104px,18vw,150px);
    border-radius:50%;
    display:block;
    object-fit:cover;
    filter:saturate(.82) contrast(1.04);
    box-shadow:0 0 0 1px var(--line);
  }

  /* Three columns pin the chevron to true centre, so it holds still while the
     noun types and erases. 33ch = 16 (longest tail) + 1 (chevron) + 16. */
  .prompt{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:baseline;
    width:33ch;
    max-width:100%;
    line-height:1;
    /* 33ch x 0.6em = 19.8em must fit the viewport, so rather than guess a vw
       value this takes the largest size that fits, capped at the desktop 21px. */
    font-size:min(21px,calc((100vw - 40px) / 19.9));
    margin-top:clamp(30px,6vw,46px);
  }
  .prompt .pre{text-align:right;white-space:nowrap}
  .prompt .post{text-align:left;white-space:nowrap}
  /* The chevron must sit INSIDE a grid item, never be one — vertical-align has
     no effect on grid items, so as a direct child its offset is ignored and
     baseline alignment lifts it a quarter em. */
  .prompt .chev-cell{line-height:1}
  .tilde{color:var(--slate)}
  .name{color:var(--offwhite)}
  .cmd{color:var(--slate)}

  /* Roboto Mono has no U+276F, so the chevron is a drawn path — never typed.
     Geometry matches the mark files exactly. */
  .chev{
    display:inline-block;width:.6em;height:1em;vertical-align:-.25em;overflow:visible;
    fill:none;stroke:var(--amber);stroke-width:174;
    stroke-linecap:round;stroke-linejoin:round;
  }

  .cursor{
    display:inline-block;width:.6em;height:.09em;
    background:var(--amber);margin-left:.04em;
    animation:blink 1.1s steps(1) infinite;
  }
  @keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}

  /* One noun visible at a time; hidden nouns are zero-width so the cursor
     trails the live one. Vertical padding gives descenders room inside the
     clip box; the matching negative margin keeps layout untouched. */
  .noun{
    display:inline-block;overflow:hidden;white-space:nowrap;vertical-align:bottom;
    width:0;color:var(--amber);
    padding-block:.4em;margin-block:-.4em;
    animation:type 20.8s infinite;
  }
  @keyframes type{
    0%     {width:0;        animation-timing-function:steps(9,end)}
    2.16%  {width:var(--w); animation-timing-function:steps(1,end)}
    10.34% {width:var(--w); animation-timing-function:steps(9,end)}
    12.5%  {width:0;        animation-timing-function:steps(1,end)}
    100%   {width:0}
  }

  /* Zero bottom margin: this is a <p>, and inside a flex container its default
     bottom margin does not collapse — it stacks on nav's top margin. */
  .tagline{
    color:var(--slate);
    font-size:clamp(13.5px,3.6vw,14px);
    margin:clamp(30px,6vw,46px) 0 0;
    text-align:center;
  }

  /* Links are buttons at every width; only the layout changes. Colours come
     from the palette — no bespoke greys. */
  .pfx{color:var(--slate)}
  .lbl{color:var(--offwhite)}
  .lchev{
    display:inline-block;width:.6em;height:1em;vertical-align:-.25em;overflow:visible;
    fill:none;stroke:var(--amber);stroke-width:174;
    stroke-linecap:round;stroke-linejoin:round;
    margin-left:auto;
  }
  nav{
    display:flex;gap:12px;
    margin-top:clamp(24px,5vw,28px);
    font-size:13px;
  }
  nav a{
    display:inline-flex;align-items:center;justify-content:flex-start;
    min-height:44px;padding:0 14px;
    border:1px solid var(--charcoal);border-radius:6px;background:var(--ink);
    text-decoration:none;
    transition:border-color .15s ease;
  }
  /* Hover brightens the border one step, charcoal to line. Nothing else moves.
     Amber stays off the outline — it is louder than the name above it. */
  nav a:hover,nav a:focus-visible{border-color:var(--line)}
  nav a:hover .lbl,nav a:focus-visible .lbl{color:var(--amber)}
  nav a:focus-visible{outline:none}

  /* Wide: equal-width chips so the set reads as one and the chevrons align —
     the same grid discipline the rest of the page runs on. The width is set by
     the longest label, ./everyexpert, so every chip matches it. Four of these
     plus their gaps need ~660px, which is where the breakpoint sits. */
  @media (min-width:701px){
    nav a{min-width:150px}
  }

  /* Narrow: stacked and full width. The prompt above is sized to fill the
     viewport exactly, so matching it means 100% rather than a ch value — a ch
     here would resolve against nav's own font-size and come up short. */
  @media (max-width:700px){
    nav{flex-direction:column;align-items:stretch;width:100%;gap:9px}
    nav a{min-height:48px;padding:0 15px;font-size:14px}
  }

  @media (prefers-reduced-motion:reduce){
    .cursor{animation:none}
    .noun{animation:none}
    .noun:first-of-type{width:var(--w)}
  }
</style>
