<style>
  /* Self-hosted so the page has no third-party requests at all. Subset to
     printable ASCII: 6.9 KB and 7.5 KB rather than 160 KB of full faces. */
  @font-face{
    font-family:'Roboto Mono';
    src:url('fonts/RobotoMono-Regular.woff2') format('woff2');
    font-weight:400;font-style:normal;font-display:swap;
  }
  @font-face{
    font-family:'Roboto Mono';
    src:url('fonts/RobotoMono-Italic.woff2') format('woff2');
    font-weight:400;font-style:italic;font-display:swap;
  }

  :root{
    --charcoal:#16181C;
    --slate:#7B8391;
    --offwhite:#F4F3F0;
    --amber:#FFA62B;
    --mono:'Roboto Mono',ui-monospace,'SF Mono',Menlo,monospace;
  }
  *{box-sizing:border-box}
  html{height:100%}
  body{
    margin:0;
    min-height:100%;
    background:#000;
    color:var(--offwhite);
    font-family:var(--mono);
    font-size:16px;
    -webkit-font-smoothing:antialiased;
    /* upper part of the page, not dead centre */
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:clamp(40px,10vh,120px) 20px 64px;
  }

  main{display:flex;flex-direction:column;align-items:center;max-width:100%}

  .avatar{
    width:clamp(104px,18vw,150px);
    height:clamp(104px,18vw,150px);
    border-radius:50%;
    display:block;
    object-fit:cover;
    filter:saturate(.82) contrast(1.04);
    box-shadow:0 0 0 1px var(--slate);
  }

  /* Three columns pin the chevron to true centre, so it holds still while the
     noun types and erases. 33ch = 16 (longest tail) + 1 (chevron) + 16. */
  .prompt{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:baseline;
    width:33ch;
    max-width:100%;
    line-height:1;
    font-size:clamp(13px,3.4vw,21px);
    margin-top:clamp(30px,6vw,46px);
  }
  .prompt .pre{text-align:right;white-space:nowrap}
  .prompt .post{text-align:left;white-space:nowrap}
  /* The chevron must sit INSIDE a grid item, never be one — vertical-align has
     no effect on grid items, so as a direct child its offset is ignored and
     baseline alignment lifts it a quarter em. */
  .prompt .chev-cell{line-height:1}
  .tilde{color:var(--slate)}
  .name{color:var(--offwhite)}
  .cmd{color:var(--slate)}

  /* Roboto Mono has no U+276F, so the chevron is a drawn path — never typed.
     Geometry matches the mark files exactly. */
  .chev{
    display:inline-block;width:.6em;height:1em;vertical-align:-.25em;overflow:visible;
    fill:none;stroke:var(--amber);stroke-width:174;
    stroke-linecap:round;stroke-linejoin:round;
  }

  .cursor{
    display:inline-block;width:.6em;height:.09em;
    background:var(--amber);margin-left:.04em;
    animation:blink 1.1s steps(1) infinite;
  }
  @keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}

  /* One noun visible at a time; hidden nouns are zero-width so the cursor
     trails the live one. Vertical padding gives descenders room inside the
     clip box; the matching negative margin keeps layout untouched. */
  .noun{
    display:inline-block;overflow:hidden;white-space:nowrap;vertical-align:bottom;
    width:0;color:var(--amber);
    padding-block:.4em;margin-block:-.4em;
    animation:type 20.8s infinite;
  }
  @keyframes type{
    0%     {width:0;        animation-timing-function:steps(9,end)}
    2.16%  {width:var(--w); animation-timing-function:steps(1,end)}
    10.34% {width:var(--w); animation-timing-function:steps(9,end)}
    12.5%  {width:0;        animation-timing-function:steps(1,end)}
    100%   {width:0}
  }

  /* Zero bottom margin: this is a <p>, and inside a flex container its default
     bottom margin does not collapse — it stacks on nav's top margin. */
  .tagline{
    color:var(--slate);
    font-size:clamp(12px,2.6vw,14px);
    margin:clamp(30px,6vw,46px) 0 0;
    text-align:center;
  }
  .tagline em{font-style:italic}

  nav{
    display:flex;gap:clamp(18px,5vw,28px);
    margin-top:clamp(11px,2vw,15px);
    font-size:clamp(11.5px,2.4vw,12.5px);
  }
  nav a{
    color:var(--slate);text-decoration:none;
    border-bottom:1px solid transparent;padding-bottom:2px;
    transition:color .15s ease,border-color .15s ease;
  }
  nav a:hover,nav a:focus-visible{color:var(--amber);border-bottom-color:var(--amber)}
  nav a:focus-visible{outline:none}

  @media (prefers-reduced-motion:reduce){
    .cursor{animation:none}
    .noun{animation:none}
    .noun:first-of-type{width:var(--w)}
  }
</style>
</head>
<body>

<main>
  <img class="avatar" src="avatar.jpg" width="320" height="320" alt="Kelly Redding">

  <div class="prompt">
    <span class="pre"><span class="tilde">~/</span><span class="name">kellyredding</span></span><!--
 --><span class="chev-cell"><svg class="chev" viewBox="0 0 1229 2048" aria-hidden="true"><path d="M422 450.5L807 888L422 1325.5"/></svg></span><!--
 --><span class="post"><span class="cmd">&nbsp;make&nbsp;</span><!--
   --><span class="noun" style="--w:3ch;animation-delay:0s">app</span><!--
   --><span class="noun" style="--w:4ch;animation-delay:2.6s">tool</span><!--
   --><span class="noun" style="--w:4ch;animation-delay:5.2s">site</span><!--
   --><span class="noun" style="--w:3ch;animation-delay:7.8s">api</span><!--
   --><span class="noun" style="--w:3ch;animation-delay:10.4s">cli</span><!--
   --><span class="noun" style="--w:4ch;animation-delay:13s">saas</span><!--
   --><span class="noun" style="--w:9ch;animation-delay:15.6s">prototype</span><!--
   --><span class="noun" style="--w:5ch;animation-delay:18.2s">thing</span><!--
   --><span class="cursor" aria-hidden="true"></span></span>
  </div>

  <p class="tagline">one builder. <em>more than enough.</em></p>

  <nav>
    <a href="https://github.com/kellyredding">github</a>
    <a href="mailto:kelly@kellyredding.com">email</a>
    <a href="https://www.linkedin.com/in/kellyredding-is-kellyredding/">linkedin</a>
  </nav>
</main>

</body>
</html>
